<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>LegalTrack · ניהול משרד</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="מערכת ניהול מתקדמת למשרדי עורכי דין - ניהול לקוחות, תיקיות ומסמכים">
  <meta name="keywords" content="עורך דין, ניהול משרד, תיקיות, לקוחות, מסמכים">
  <meta name="author" content="LegalTrack">
  
  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest.json">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#0F1E33">
  <meta name="msapplication-TileColor" content="#0F1E33">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="LegalTrack - ניהול משרד עורכי דין">
  <meta property="og:description" content="מערכת ניהול מתקדמת למשרדי עורכי דין">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/icons/og-image.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- Preload Critical Resources -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" as="style">
  
  <!-- Loading screen (same navy as the sign-in panel) -->
  <style>
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #0F1E33;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      transition: opacity 0.3s ease;
      font-family: 'Heebo', sans-serif;
    }
    .loading-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #1B3355;
      border: 1px solid #2A4870;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 26px;
    }
    .loading-text { color: #FFFFFF; font-size: 22px; font-weight: 600; }
    .loading-subtitle { color: #A8B6C9; font-size: 14px; }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #6F8FB8;
      animation: spin 1s linear infinite;
      margin-top: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loading-spinner { animation-duration: 3s; } }
    body.app-loaded .loading-screen { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen" role="status" aria-label="טוען">
    <div class="loading-logo" aria-hidden="true">&#9878;</div>
    <div class="loading-text">LegalTrack</div>
    <div class="loading-subtitle">ניהול משרד</div>
    <div class="loading-spinner"></div>
  </div>
  
  <!-- Main App -->
  <app-root></app-root>
  
  <!-- Loading Script -->
  <script>
    // Hide loading screen when app is loaded
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        document.body.classList.add('app-loaded');
        setTimeout(function() {
          const loadingScreen = document.getElementById('loadingScreen');
          if (loadingScreen) {
            loadingScreen.remove();
          }
        }, 500);
      }, 1000);
    });
    
    // Update favicon dynamically with gavel icon
    function setCustomFavicon() {
      // Create canvas element
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      
      // Draw background
      ctx.fillStyle = '#1B3355';
      ctx.fillRect(0, 0, 32, 32);
      
      // Add rounded corners
      ctx.globalCompositeOperation = 'destination-in';
      ctx.beginPath();
      ctx.roundRect(0, 0, 32, 32, 6);
      ctx.fill();
      
      // Reset composite operation
      ctx.globalCompositeOperation = 'source-over';
      
      // Draw gavel icon (simplified)
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '18px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚖', 16, 16);
      
      // Convert to data URL and set as favicon
      const dataURL = canvas.toDataURL('image/png');
      
      // Update existing favicon
      let favicon = document.querySelector('link[rel="icon"]');
      if (!favicon) {
        favicon = document.createElement('link');
        favicon.rel = 'icon';
        document.head.appendChild(favicon);
      }
      favicon.href = dataURL;
      
      // Also update shortcut icon
      let shortcutIcon = document.querySelector('link[rel="shortcut icon"]');
      if (!shortcutIcon) {
        shortcutIcon = document.createElement('link');
        shortcutIcon.rel = 'shortcut icon';
        document.head.appendChild(shortcutIcon);
      }
      shortcutIcon.href = dataURL;
    }
    
    // Set custom favicon when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setCustomFavicon);
    } else {
      setCustomFavicon();
    }
  </script>
</body>
</html>
